[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffuselab"
version = "0.1.0"
description = "Explicit learned two-dimensional DDPM with offline controls"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
diffuselab = "diffuselab.cli:main"

[tool.setuptools.packages.find]
include = ["diffuselab*"]
